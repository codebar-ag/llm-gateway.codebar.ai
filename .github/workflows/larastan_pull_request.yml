name: Pull Request | Larastan

on: pull_request

jobs:
  larastan:
    runs-on: ${{ vars.USE_GITHUB_RUNNER == 'true' && fromJSON('{"labels":["ubuntu-latest"]}') || fromJSON('{"group":"Default"}') }}
    name: pull-request | larastan

    env:
      PHP_VERSION: 8.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, fileinfo, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, intl

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Run Larastan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
