name: Pull Request | Audit

on: pull_request

jobs:
  audit:
    runs-on: ${{ vars.USE_GITHUB_RUNNER == 'true' && fromJSON('{"labels":["ubuntu-latest"]}') || fromJSON('{"group":"Default"}') }}
    name: pull-request | audit

    env:
      PHP_VERSION: 8.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, fileinfo, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, intl

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      # Fails the pull request on a known advisory in the locked dependency
      # tree. Dependabot already opens PRs for updates; this is the half that
      # blocks merging something vulnerable rather than only notifying about it.
      - name: Audit Composer Dependencies
        run: composer audit
