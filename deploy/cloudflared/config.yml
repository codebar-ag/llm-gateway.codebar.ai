# Cloudflare Tunnel for the async gateway.
#
# Setup once:
#   brew install cloudflared
#   cloudflared tunnel login
#   cloudflared tunnel create llm-async
#   cloudflared tunnel route dns llm-async llm.async.example.com
#
# Then copy this file to ~/.cloudflared/config.yml (or symlink it) and fill in
# the tunnel id below. The credentials file is written by `tunnel create` and
# must stay out of version control.

tunnel: llm-async
credentials-file: /Users/YOU/.cloudflared/<TUNNEL-ID>.json

# cloudflared answers /ready here once it is connected to the edge. The app
# polls it for the tunnel indicator shown on the dashboard.
metrics: 127.0.0.1:20241

# Default deny: anything not matched by a rule below never reaches the origin.
# Rules are evaluated top to bottom and `path` is a regex over the URL path, so
# each surface is published on purpose rather than by omission.
#
# Herd routes by Host header, so the public name has to be rewritten to the
# local site name — without `httpHostHeader` you land on Herd's default site.
#
# Point at :443, not :80. A site secured with `herd secure` answers port 80
# with a 301 to https://<site>.test, which a public visitor cannot resolve.
# The certificate is Herd's own, so `noTLSVerify` is required; the connection
# never leaves the loopback interface. If the site is NOT secured, use
# `service: http://127.0.0.1:80` and drop the two TLS lines.

ingress:

  # The API. Callers bring their own LiteLLM key; upstream decides whether it
  # is any good. This is the only surface that has to be open to the world.
  #
  # Both shapes of the API are published: `/v1/…`, which the `gateway`
  # middleware resolves to the default gateway, and `/<uuid>/v1/…`, which is
  # the base URL the dashboard hands out for a named gateway. Publishing only
  # the first would 404 every caller configured against a specific gateway.
  - hostname: llm.async.example.com
    path: ^/(up$|([0-9a-fA-F-]{36}/)?v1/)
    service: https://127.0.0.1:443
    originRequest:
      httpHostHeader: llm-gateway.codebar.test
      originServerName: llm-gateway.codebar.test
      noTLSVerify: true
      connectTimeout: 30s

  # The dashboard, plus the built assets and favicon it needs. Guarded in the
  # app by an operator login, and by DASHBOARD_TOKEN in front of it when one is
  # configured — so a leaked hostname is not enough to read anyone's prompts.
  #
  # `login` and `logout` have to be here. They are the way in, and leaving them
  # out publishes a dashboard nobody can sign in to: the catch-all below
  # answers 404 and the app is never reached at all.
  #
  # `gateways` is part of this: it decides where every request in the app is
  # sent, so it is behind the same guards and the same deliberate publish.
  # `callers` names key hashes and reads the backlog's attribution.
  #
  # Two ways to tighten this further:
  #   - delete this block to keep the dashboard on the LAN only; the API above
  #     keeps working and the token guard stays as the local-network guard.
  #   - add a Cloudflare Access policy on the hostname (Zero Trust → Access →
  #     Applications) for SSO in front of the token.
  - hostname: llm.async.example.com
    path: ^/($|login$|logout$|callers($|/)|entries/|gateways($|/)|build/|favicon\.)
    service: https://127.0.0.1:443
    originRequest:
      httpHostHeader: llm-gateway.codebar.test
      originServerName: llm-gateway.codebar.test
      noTLSVerify: true
      connectTimeout: 30s

  - service: http_status:404
